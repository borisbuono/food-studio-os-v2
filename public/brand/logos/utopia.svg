<?xml version="1.0" encoding="UTF-8"?>
<!-- Utopia placeholder — Fraunces italic wordmark. Boris drops in the real mark at this same path. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" width="260" height="240" role="img" aria-label="Restaurant Utopia">
  <style>
    .word { font-family: 'Fraunces', 'Georgia', serif; font-weight: 400; font-style: italic; font-size: 44px; fill: currentColor; letter-spacing: -0.01em; }
    .caption { font-family: 'DM Mono', 'Menlo', monospace; font-size: 11px; fill: currentColor; opacity: 0.6; letter-spacing: 0.24em; text-transform: uppercase; }
  </style>
  <text x="130" y="132" text-anchor="middle" class="word">Utopia</text>
  <text x="130" y="176" text-anchor="middle" class="caption">Restaurant</text>
</svg>
