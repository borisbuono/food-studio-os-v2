<?xml version="1.0" encoding="UTF-8"?>
<!-- Ibiza Food Studios placeholder monogram — Fraunces IFS. Boris drops in the real mark at this same path. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Ibiza Food Studios">
  <style>
    .mono { font-family: 'Fraunces', 'Georgia', serif; font-weight: 400; font-size: 96px; fill: currentColor; letter-spacing: -0.02em; }
    .caption { font-family: 'DM Mono', 'Menlo', monospace; font-size: 11px; fill: currentColor; opacity: 0.6; letter-spacing: 0.24em; text-transform: uppercase; }
  </style>
  <text x="120" y="132" text-anchor="middle" class="mono">IFS</text>
  <text x="120" y="180" text-anchor="middle" class="caption">Ibiza Food Studios</text>
</svg>
