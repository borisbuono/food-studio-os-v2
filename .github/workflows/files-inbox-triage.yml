# Runs every 15 min to trigger Files Inbox triage on Vercel.
# Bypass for Vercel Hobby's daily-cron-only limit.
# Uses GitHub Actions free tier — zero cost.
name: Files Inbox Triage (every 15 min)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:  # manual trigger from GitHub Actions UI

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/files-inbox
        run: |
          curl -sSf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.foodstudio.ai/api/cron/files-inbox \
            || echo "trigger failed (non-fatal)"
